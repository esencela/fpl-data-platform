[build-system]
requires = ["setuptools>=61.0"]

[project]
name = "fpl-data-platform"
version = "0.1.0"
description = "FPL data platform"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"