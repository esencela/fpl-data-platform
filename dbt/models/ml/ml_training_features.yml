version: 2

models:
  - name: ml_training_features
    description: 'Table containing all features for ML model training'
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - fixture_key

    columns:
      - name: player_game_key
        tests:
          - not_null
          - unique

      - name: fixture_key
        tests:
          - not_null

      - name: player_id
        tests:
          - not_null

      - name: fpl_position
        tests:
          - not_null

      - name: team_id
        tests:
          - not_null

      - name: at_home
        tests:
          - not_null