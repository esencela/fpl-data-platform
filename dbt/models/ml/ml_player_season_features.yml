              arguments:
                expression: "is not null or games_played is null or games_played = 0"
      
      - name: key_passes_per_game
        description: 'Average key passes per game played by player within season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played is null or games_played = 0"

      - name: goals_conceded_per_game
        description: 'Average goals conceded per game played by player within season'
