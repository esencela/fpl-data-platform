version: 2

models:
  - name: ml_player_season_features
    description: 'Table holding season stats for use as features in machine learning'

    columns:
      - name: player_season_key
        description: 'Primary key identifying each player season'
        tests:
          - unique
          - not_null

      - name: player_id
        description: 'Unique identifier for each player'
        tests:
          - not_null

      - name: season
        description: 'Season of game - e.g. 2026 for 25/26 season'
        tests:
          - not_null

      - name: games_total
        description: 'Total games played by team within season'

      - name: games_played
        description: 'Games played by player within season'

      - name: games_started
        description: 'Games started by player within season'

      - name: total_minutes
        description: 'Total minutes played by player within season'

      - name: shots
        description: 'Total shots taken by player within season'

      - name: appearance_rate
        description: 'Rate at which player appears in games within season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_total is null or games_total = 0"

      - name: starting_rate
        description: 'Rate at which player starts games they played within season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played is null or games_played = 0"

      - name: clean_sheet_rate
        description: 'Rate at which player keeps clean sheets in games they played within season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played is null or games_played = 0"

      - name: shot_conversion_rate
        description: 'Rate at which player scores goals from shots taken within season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or shots is null or shots = 0"

      - name: minutes_per_game
        description: 'Average minutes per game played by player within season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played is null or games_played = 0"

      - name: goals_per_game
        description: 'Average goals per game played by player within season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played is null or games_played = 0"

      - name: assists_per_game
        description: 'Average assists per game played by player within season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played is null or games_played = 0"

      - name: goal_involvements_per_game
        description: 'Average goal involvements per game played by player within season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played is null or games_played = 0"

      - name: shots_per_game
        description: 'Average shots per game played by player within season'
        tests:
