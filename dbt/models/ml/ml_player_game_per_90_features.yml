version: 2

models:
  - name: ml_player_game_per_90_features
    description: 'Table holding per 90 stats for use as features in machine learning'
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_game_key
              - player_id

    columns:
      - name: player_game_key
        description: 'Primary key identifying each player game'
        tests:
          - unique
          - not_null

      - name: fixture_key
        description: 'Foreign Key identifying each fixture'
        tests:
          - not_null

      - name: season
        description: 'Season of game - e.g. 2026 for 25/26 season'

      - name: player_id
        description: 'Unique identifier for each player'

      - name: team_id
        description: 'Unique identifier for each team'

      - name: total_minutes_prior
        description: 'Minutes played this season, before match'

      - name: goals_per_90
        description: 'Goals per 90 minutes of game time within season, before match'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or total_minutes_prior is null or total_minutes_prior = 0"

      - name: assists_per_90
        description: 'Assists per 90 minutes of game time within season, before match'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or total_minutes_prior is null or total_minutes_prior = 0"

      - name: goal_involvements_per_90
        description: 'Goal involvements per 90 minutes of game time within season, before match'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
