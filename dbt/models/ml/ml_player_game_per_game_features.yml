version: 2

models:
  - name: ml_player_game_per_game_features
    description: 'Table holding per game stats for use as features in machine learning'
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_game_key
              - player_id

    columns:
      - name: player_game_key
        description: 'Primary key identifying each player game'
        tests:
          - unique
          - not_null

      - name: fixture_key
        description: 'Foreign Key identifying each fixture'
        tests:
          - not_null

      - name: season
        description: 'Season of game - e.g. 2026 for 25/26 season'

      - name: player_id
        description: 'Unique identifier for each player'

      - name: games_played_prior
        description: 'Games played within season, before match'

      - name: starting_rate
        description: 'Rate at which player starts games they played within season, before match'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: clean_sheet_rate
        description: 'Rate at which player keeps clean sheet in played games within season, before match'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: minutes_per_game
        description: 'Minutes played per game played within season, before match'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: goals_per_game
        description: 'Goals per game played within season, before match'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: assists_per_game
        description: 'Assists per game played within season, before match'
        tests:
