version: 2

models:
  - name: ml_team_game_per_game_features
    description: 'Table holding per game team stats for us as features for machine learning'
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['fixture_key', 'team_id']

    columns:
      - name: fixture_key
        description: 'Composite key uniquely identifying each fixture'
        tests:
          - not_null

      - name: team_id
        description: 'Unique identifier of team'
        tests:
          - not_null

      - name: at_home
        description: 'Whether game was a home fixture'
        tests:
          - not_null

      - name: games_played_prior
        description: 'Games played by team this season up to this match'

      - name: team_days_since_last_game
        description: 'Days since last game played by team this season up to this match'

      - name: team_goals_scored_per_game
        description: 'Goals scored per game this season by team'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: team_goals_conceded_per_game
        description: 'Goals conceded per game this season by team'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: team_shots_per_game
        description: 'Shots taken per game this season by team'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: team_shots_against_per_game
        description: 'Shots conceded per game this season by team'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: team_expected_goals_per_game
        description: 'Expected goals per game this season by team'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: team_expected_goals_conceded_per_game
        description: 'Expected goals conceded per game this season by team'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: team_xg_diff_per_game
        description: 'Average expected goals - goals this season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: team_xgc_diff_per_game
        description: 'Average expected goals conceded - goals conceded this season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: team_penalties_taken_per_game
        description: 'Penalties awarded per game to team this season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: team_penalties_conceded_per_game
        description: 'Penalties given per game against team this season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: team_passes_per_game
        description: 'Passes made in own half by team per game this season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: team_deep_completions_per_game
        description: 'Average non cross passes completed by team that reach within 20 meters of the opponents goal this season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: team_passes_against_per_game
        description: 'Passes allowed in opposition half by team per game this season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: team_deep_completions_against_per_game
