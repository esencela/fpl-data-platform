      - name: team_passes_per_defensive_action_per_game
        description: 'Average team ppda per game this season'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior is null or games_played_prior = 0"

      - name: team_influence_per_game
