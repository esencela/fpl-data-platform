version: 2

models:
  - name: ml_player_game_form_features
    description: 'Table holding rolling stats for use as features in machine learning'
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_game_key
              - player_id

    columns: 
      - name: player_game_key
        description: 'Primary key identifying each player game'
        tests:
          - unique
          - not_null

      - name: fixture_key
        description: 'Foreign Key identifying each fixture'
        tests:
          - not_null

      - name: season
        description: 'Season of game - e.g. 2026 for 25/26 season'

      - name: player_id
        description: 'Unique identifier for each player'

      - name: games_last_30_days
        description: 'How many games team played in last 30 days'

      - name: minutes_last_30_days
        description: 'Minutes played in last 30 days'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_last_30_days = 0"

      - name: avg_minutes_last_30_days
        description: 'Average minutes played in each game in last 30 days'
        tests:
          - dbt_utils.expression_is_true:
              arguments: 
                expression: "is not null or minutes_last_30_days is null or minutes_last_30_days = 0"

      - name: goals_last_30_days
        description: 'Goals scored in last 30 days'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_last_30_days = 0"

      - name: goals_per_90_last_30_days
        description: 'Goals per 90 minutes of game time in last 30 days'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or minutes_last_30_days = 0 or minutes_last_30_days is null"

      - name: assists_last_30_days
        description: 'Assists in last 30 days'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_last_30_days = 0"

      - name: assists_per_90_last_30_days
        description: 'Assists per 90 minutes of game time in last 30 days'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or minutes_last_30_days = 0 or minutes_last_30_days is null"

      - name: goal_involvements_last_30_days
        description: 'Goal involvements in last 30 days'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_last_30_days = 0"

      - name: goal_involvements_per_90_last_30_days
        description: 'Goal involvements per 90 minutes of game time in last 30 days'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or minutes_last_30_days = 0 or minutes_last_30_days is null"

      - name: shots_last_30_days
        description: 'Shots taken in last 30 days'
        tests:
          - dbt_utils.expression_is_true:
