version: 2

models:
  - name: ml_team_game_form_features
    description: 'Features for team form model'
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['fixture_key', 'team_id']

    columns:
      - name: fixture_key
        description: 'Composite key uniquely identifying fixture played'
        tests:
          - not_null

      - name: team_id
        description: 'Unique identifier of team'
        tests:
          - not_null

      - name: at_home
        description: 'Whether game was a home fixture'
        tests:
          - not_null

      - name: games_played_prior
        description: 'Number of games considered in form calculation, excluding current game'

      - name: team_goals_scored_per_game_last_5
        description: 'Average goals scored by team in last 5 games'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior = 0 or games_played_prior is null"

      - name: team_goals_conceded_per_game_last_5
        description: 'Average goals conceded by team in last 5 games'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior = 0 or games_played_prior is null"

      - name: team_shots_per_game_last_5
        description: 'Average shots taken by team in last 5 games'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior = 0 or games_played_prior is null"

      - name: team_shots_against_per_game_last_5
        description: 'Average shots taken by opposing team in last 5 games'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior = 0 or games_played_prior is null"

      - name: team_expected_goals_per_game_last_5
        description: 'Average expected goals accumulated by team in last 5 games'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior = 0 or games_played_prior is null"

      - name: team_expected_goals_conceded_per_game_last_5
        description: 'Average expected goals accumulated by opposing team in last 5 games'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior = 0 or games_played_prior is null"

      - name: team_xg_diff_per_game_last_5
        description: 'Expected goals - goals per game, measures finishing performance'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is not null or games_played_prior = 0 or games_played_prior is null"

      - name: team_xgc_diff_per_game_last_5
        description: 'Expected goals conceded - goals conceded per game, measures defensive performance'
        tests:
          - dbt_utils.expression_is_true:
