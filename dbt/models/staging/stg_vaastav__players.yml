version: 2

models:
  - name: stg_vaastav__players
    description: 'Staging model for player data from the bootstrap-static endpoint of the FPL API'
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - season
    columns:
      - name: player_id
        description: 'Unique identifier for each player'
        tests:
          - not_null          
      - name: season
        description: 'Season for which the player data is relevant - e.g. 2026 for the 2025/2026 season'
        tests:
          - not_null
      - name: player_season_id
        description: 'Unique identifier for each player within a season'
        tests:
          - not_null
      - name: team_id
        description: 'Unique identifier of the team the player belongs to'
        tests:
          - not_null
      - name: team_season_id
        description: 'Unique identifier for each team within a season'
        tests:
          - not_null
      - name: first_name
        description: 'Player first name'
      - name: last_name
        description: 'Player last name'
      - name: web_name
        description: 'Player name used on the FPL website'
      - name: known_name
        description: 'Alternate names for certain players - e.g. Brazilian players with long names'
      - name: country_id
        description: 'Unique identifier for the players country of origin'
      - name: birth_date
        description: 'Player birth date'
      - name: position_id
        description: 'Unique identifier for the players position'
        tests:
          - accepted_values:
              arguments:
                values: ['GKP', 'DEF', 'MID', 'FWD']
      - name: now_cost
        description: 'Current cost of the player in the FPL game'
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"