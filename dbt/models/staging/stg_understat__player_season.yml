version: 2

models:
  - name: stg_understat__player_season
    description: 'Staging model for understat player season data'
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season
              - player_id

    columns:
      - name: season
        description: 'Season for which player data is relevant - e.g. 2026 for 2025/26 season'
        tests:
          - not_null

      - name: player_id
        description: 'Unique identifier for understat players'
        tests:
          - not_null

      - name: player_name
        description: 'Name of player'
        tests:
          - not_null
      
      - name: team_name
        description: 'Name of team player plays on - can be multiple e.g. Tottenham,West Ham'
        tests:
          - not_null