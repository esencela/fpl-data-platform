version: 2

models:  
  - name: stg_fpl__fixtures
    description: 'Staging model for fixture data from the fixtures endpoint of the FPL API'
    
    columns:
      - name: fixture_id
        description: 'Unique identifier for each fixture'
        tests:
          - unique
          - not_null
      
      - name: season
        description: 'Season for which the fixture data is relevant - e.g. 2026 for the 2025/2026 season'
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 2016"
      
      - name: fixture_season_id
        description: 'Unique identifier for each fixture within a season'
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      
      - name: gameweek_id
        description: 'Gameweek in which the fixture takes place'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      
      - name: kickoff_time
        description: 'Date and time of fixture kickoff'
      
      - name: finished
        description: 'Whether fixture has been played (true) or is upcoming (false)'
        tests: 
          - not_null
      
      - name: home_team_season_id
        description: 'Unique identifier for home team within a season'
        tests:
          - not_null
      
      - name: home_team_score
        description: 'Goals scored by home team (null if fixture is upcoming)'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 or home_team_score is null"
      
      - name: away_team_season_id
        description: 'Unique identifier for away team within a season'
        tests:
          - not_null
      
      - name: away_team_score
        description: 'Goals scored by away team (null if fixture is upcoming)'
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0 or away_team_score is null"
      
      - name: home_team_difficulty
        description: 'Difficulty rating of fixture for home team provided by FPL'
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 1 and 5"
      
      - name: away_team_difficulty
        description: 'Difficulty rating of fixture for away team provided by FPL'
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 1 and 5"
