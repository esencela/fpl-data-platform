version: 2

models:
  - name: fact_match
    description: 'Fact table holding metrics for each match'

    columns:
      - name: fixture_key
        description: 'Foreign key referencing fixture dimension table'
        tests:
          - unique
          - not_null

      - name: home_team_id
        description: 'Foreign key referencing team dimension table for home team'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id

      - name: away_team_id
        description: 'Foreign key referencing team dimension table for away team'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id

      - name: home_team_score
        description: 'Goals scored by home team in match'
        tests:
          - not_null

      - name: away_team_score
        description: 'Goals scored by away team in match'
        tests:
          - not_null

      - name: home_shots
        description: 'Shots taken by home team in match'
        tests:
          - not_null

      - name: away_shots
        description: 'Shots taken by away team in match'
        tests:
          - not_null

      - name: home_expected_goals
        description: 'Expected goals accumulated by home team during match'
        tests:
          - not_null

      - name: away_expected_goals
        description: 'Expected goals accumulated by away team during match'
        tests:
          - not_null

      - name: home_xg_diff
        description: 'Expected goals - goals scored for home team'
        tests:
          - not_null

      - name: away_xg_diff
        description: 'Expected goals - goals scored for away team'
        tests:
          - not_null

      - name: home_penalties_scored
        description: 'Penalties scored by home team during match'
        tests:
          - not_null

      - name: home_penalties_taken
        description: 'Penalties taken by home team during match'
        tests:
          - not_null

      - name: away_penalties_scored
        description: 'Penalties scored by away team during match'
        tests:
          - not_null

      - name: away_penalties_taken
        description: 'Penalties taken by away team during match'
        tests:
          - not_null

      - name: home_passes
        description: 'Passes made by home team during match'
        tests:
          - not_null

      - name: home_deep_completions
        description: 'Non cross passes completed by home team that reach 20 meters of the opponents goal'
        tests:
          - not_null

      - name: away_passes
        description: 'Passes made by away team during match'
        tests:
          - not_null

      - name: away_deep_completions
        description: 'Non cross passes completed by away team that reach 20 meters of the opponents goal'
        tests:
          - not_null

      - name: home_defensive_actions
        description: 'Defensive actions made by home team - e.g. tackles, interceptions, challenges, and fouls'
        tests:
          - not_null

      - name: home_ppda
        description: 'Metric calculating how many passes away team is allowed before home team attempts to win the ball - measures pressing intensity'
        tests:
          - not_null

      - name: away_defensive_actions
        description: 'Defensive actions made by away team - e.g. tackles, interceptions, challenges, and fouls'
        tests:
          - not_null

      - name: away_ppda
        description: 'Metric calculating how many passes home team is allowed before away team attempts to win the ball - measures pressing intensity'
        tests:
          - not_null

      - name: home_influence
        description: 'Total influence score of each player in home team during match'
        tests:
          - not_null

      - name: home_creativity
        description: 'Total creativity score of each player in home team during match'
        tests:
          - not_null

      - name: home_threat
        description: 'Total threat score of each player in home team during match'
        tests:
          - not_null

      - name: home_ict_index
        description: 'Total ict index score of each player in home team during match'
        tests:
          - not_null

      - name: away_influence
        description: 'Total influence score of each player in away team during match'
        tests:
          - not_null

      - name: away_creativity
        description: 'Total creativity score of each player in away team during match'
        tests:
          - not_null

      - name: away_threat
        description: 'Total threat score of each player in away team during match'
        tests:
          - not_null

      - name: away_ict_index
        description: 'Total ict index score of each player in away team during match'
        tests:
          - not_null

      - name: home_yellow_cards
        description: 'Yellow cards received by home team during match'
        tests:
          - not_null

      - name: home_red_cards
        description: 'Red cards received by home team during match'
        tests:
          - not_null

      - name: away_yellow_cards
        description: 'Yellow cards received by away team during match'
        tests:
          - not_null

      - name: away_red_cards
        description: 'Red cards received by away team during match'
        tests:
          - not_null