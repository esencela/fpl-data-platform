version: 2

models:
  - name: fact_player_season
    description: 'Fact table holding season metrics of each player'

    columns:
      - name: player_season_key
        description: 'Composite primary key identifying each player season'
        tests:
          - unique
          - not_null
      
      - name: player_id
        description: 'Foreign key referencing player dimension table'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_player')
                field: player_id

      - name: season
        description: 'Season of each player season - e.g. 2026 for 2025/26 season'
        tests:
          - not_null

      - name: team_id
        description: 'Foreign key referencing team dimension table'
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id

      - name: games_total
        description: 'Amount of games player was in squad for during season'
        tests:
          - not_null

      - name: games_played
        description: 'Amount of games that player featured in during season'
        tests:
          - not_null

      - name: games_started
        description: 'Amount of games that player started in during season'
        tests:
          - not_null

      - name: total_minutes
        description: 'Game time accumulated by player during season'
        tests:
          - not_null

      - name: goals
        description: 'Goals scored by player during season'
        tests:
          - not_null

      - name: assists
        description: 'Assists awarded by FPL to player during season'
        tests:
          - not_null

      - name: goal_involvements
        description: 'Goals + assists during season'
        tests:
          - not_null

      - name: shots
        description: 'Shots taken by player during season'
        tests:
          - not_null

      - name: key_passes
        description: 'Key passes made by player during season'
        tests:
          - not_null

      - name: clean_sheets
        description: 'Clean sheets earned by player during season'
        tests:
          - not_null

      - name: own_goals
        description: 'Own goals scored by player during season'
        tests:
          - not_null

      - name: yellow_cards
        description: 'Yellow cards received by player during season'
        tests:
          - not_null

      - name: red_cards
        description: 'Red cards received by player during season'
        tests:
          - not_null

      - name: penalties_scored
        description: 'Penalties scored by player during season'
        tests:
          - not_null

      - name: penalties_taken
        description: 'Penalties taken by player during season'
        tests:
          - not_null

      - name: penalties_saved
        descriptoin: 'Penalties saved by player during season'
        tests:
          - not_null

      - name: clearances_blocks_interceptions
        description: 'Clearances + blocks + interceptions made by player during season'

      - name: recoveries
        description: 'Recoveries made by player during season'

      - name: tackles
        description: 'Tackled made by player during season'

      - name: defensive_contributions
        description: 'Defensive contributions awarded by FPL to player during season'

      - name: saves
        description: 'Saves made by player during season'
        tests:
          - not_null

      - name: total_points
        description: 'FPL points received by player during season'
        tests:
          - not_null

      - name: bonus
        description: 'Bonus points received by player during season'
        tests:
          - not_null

      - name: bps
        description: 'Points earned from the bonus points system during season'
        tests:
          - not_null

      - name: influence
        description: 'Total influence score logged throughout season'
        tests:
          - not_null

      - name: creativity
        description: 'Total creativity score logged throughout season'
        tests:
          - not_null

      - name: threat
        description: 'Total threat score logged throughout season'
        tests:
          - not_null

      - name: ict_index
        description: 'Total ict index score logged throughout season'
        tests:
          - not_null

      - name: expected_goals
        description: 'Expected goals accumulated throughout season'
        tests:
          - not_null

      - name: expected_assists
        description: 'Expected assists accumulated throughout season'
        tests:
          - not_null

      - name: expected_goal_involvements
        description: 'Expected goals + expected assists during season'