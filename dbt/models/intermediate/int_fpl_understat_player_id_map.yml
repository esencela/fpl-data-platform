version: 2

models:
  - name: int_fpl_understat_player_id_map
    description: 'FPL -> Understat player id map for missing understat ids, matched on name similarity'

    columns:
      - name: fpl_player_id
        tests:
          - not_null
          - unique

      - name: understat_player_id
        tests:
          - unique