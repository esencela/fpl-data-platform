services:
  postgres:
    image: postgres:15
    container_name: fpl-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - fpl_postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  ingestion:
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres 
    
  dbt:
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile
    env_file:
      - .env
    volumes:
      - ./dbt:/app/dbt
    depends_on:
      - postgres

volumes:
  fpl_postgres_data: